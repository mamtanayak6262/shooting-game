
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON STRIKE 3D Multiplayer</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080d1c;color:white;font-family:Arial}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.panel{pointer-events:auto;background:#101b30eF;border:1px solid #294d70;
border-radius:13px;padding:14px;box-shadow:0 5px 25px #0008}
#menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:min(380px,92vw);text-align:center}
h1{color:#36e9ff;margin:5px;font-size:30px}
input{width:100%;padding:12px;margin:7px 0;background:#081323;
border:1px solid #287c9b;border-radius:8px;color:white}
button{padding:12px 15px;border:0;border-radius:8px;
background:linear-gradient(90deg,#087cdd,#00d6dc);
color:white;font-weight:bold;cursor:pointer;margin:4px}
button:hover{filter:brightness(1.2)}
#hud{display:none}
#top{position:absolute;top:12px;left:12px;right:12px;
display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#status{font-size:13px;color:#53edff}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
font-size:27px;color:#54faff;text-shadow:0 0 8px cyan}
#bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
text-align:center;font-size:13px;color:#d6eaff}
#mobile{display:none;position:absolute;bottom:15px;right:15px;pointer-events:auto}
#mobile button{width:60px;height:60px;border-radius:50%;background:#087cddbb}
#move{position:absolute;bottom:20px;left:15px;display:none;pointer-events:auto}
#move button{width:55px;height:55px;border-radius:50%}
#leader{font-size:12px;line-height:1.7}
@media(max-width:700px){
 #mobile,#move{display:block}
 #bottom{bottom:135px}
}
</style>
</head>
<body>
<div id="ui">
 <div id="menu" class="panel">
  <h1>NEON STRIKE 3D</h1>
  <p>REAL-TIME MULTIPLAYER ARENA</p>
  <p style="color:#8caac8;font-size:13px">Create a room or join using Player ID</p>
  <button onclick="createRoom()">CREATE ROOM</button>
  <hr style="border-color:#294d70">
  <input id="joinId" placeholder="Enter Host Player ID">
  <button onclick="joinRoom()">JOIN ROOM</button>
  <p id="message" style="font-size:12px;color:#55eaff">Connecting system...</p>
  <p style="font-size:11px;color:#8caac8">Share your Player ID with your friend.</p>
 </div>

 <div id="hud">
  <div id="top">
   <div class="panel">
    <b>NEON STRIKE</b>
    <div id="status">Connecting...</div>
    <div id="myid" style="font-size:11px;margin-top:5px"></div>
   </div>
   <div class="panel">
    <b>PLAYERS / SCORE</b>
    <div id="leader">Waiting...</div>
   </div>
  </div>
  <div id="crosshair">+</div>
  <div id="bottom">WASD: MOVE | MOUSE: LOOK | CLICK: LASER | SPACE: JUMP</div>
  <div id="move">
   <button data-key="KeyW">↑</button><br>
   <button data-key="KeyA">←</button>
   <button data-key="KeyS">↓</button>
   <button data-key="KeyD">→</button>
  </div>
  <div id="mobile">
   <button onclick="shoot()">FIRE</button>
   <button onclick="jump()">JUMP</button>
  </div>
 </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
let peer,host=false,connected=false,hostConn=null;
let connections={},players={},models={},keys={};
let myId='',myScore=0,health=100;
let yaw=0,pitch=0,velocityY=0,grounded=true;
let lastSend=0,lastBroadcast=0;
let scene,camera,renderer,clock;
let lasers=[];
const SPEED=7;
const ARENA=45;

const randomId=()=>'neon-'+Math.random().toString(36).slice(2,9);

function setMessage(t){$('message').textContent=t}

peer=new Peer(randomId());

peer.on('open',id=>{
 myId=id;
 setMessage('Ready! Your Player ID: '+id);
});

peer.on('error',e=>{
 setMessage('Network: '+e.type+'. Check your connection.');
});

peer.on('connection',conn=>{
 if(!host)return;
 connections[conn.peer]=conn;
 players[conn.peer]=newPlayer(conn.peer);
 conn.on('data',data=>handleData(conn.peer,data));
 conn.on('close',()=>{
  delete connections[conn.peer];
  delete players[conn.peer];
  removeModel(conn.peer);
 });
 conn.on('open',()=>{
  conn.send({type:'welcome',players:Object.values(players)});
 });
});

window.createRoom=()=>{
 if(!peer||!myId)return setMessage('Please wait...');
 host=true;
 startGame();
};

window.joinRoom=()=>{
 const id=$('joinId').value.trim();
 if(!id)return setMessage('Enter Host Player ID');
 if(id===myId)return setMessage('Cannot join yourself');
 setMessage('Connecting to host...');
 const conn=peer.connect(id,{reliable:true});
 conn.on('open',()=>{
  hostConn=conn;
  connected=true;
  conn.on('data',data=>handleData(id,data));
  conn.on('close',()=>{
   $('status').textContent='Host disconnected';
  });
  startGame();
  conn.send({type:'join',player:newPlayer(myId)});
 });
 conn.on('error',()=>setMessage('Connection failed. Try again.'));
};

function newPlayer(id){
 return {id,x:0,z:0,y:1.6,yaw:0,pitch:0,score:0,health:100};
}

function handleData(id,data){
 if(!data)return;
 if(data.type==='join'&&host){
  players[id]=data.player||newPlayer(id);
  return;
 }
 if(data.type==='state'){
  if(host){
   if(players[id])Object.assign(players[id],data.player);
  }else if(data.player){
   updateRemote(data.player);
  }
 }
 if(data.type==='snapshot'&&!host){
  data.players.forEach(p=>{
   if(p.id!==myId)updateRemote(p);
  });
  $('leader').innerHTML=data.players.map(p=>
   `${p.id.slice(0,12)} : ${p.score} pts`).join('<br>');
 }
 if(data.type==='shoot'&&host){
  checkShot(id,data.origin,data.dir);
 }
 if(data.type==='hit'){
  $('status').textContent='TARGET HIT! +10 SCORE';
  myScore=data.score;
 }
 if(data.type==='scores'){
  $('leader').innerHTML=data.players.map(p=>
   `${p.id.slice(0,12)} : ${p.score} pts`).join('<br>');
 }
}

function startGame(){
 $('menu').style.display='none';
 $('hud').style.display='block';
 $('myid').textContent='ID: '+myId;
 $('status').textContent=host?'ROOM HOST':'CONNECTED';
 if(!players[myId])players[myId]=newPlayer(myId);
 connected=true;
 init3D();
}

function init3D(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x080d1c);
 scene.fog=new THREE.Fog(0x080d1c,35,100);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);
 camera.position.set(0,1.6,0);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 document.body.appendChild(renderer.domElement);

 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0x8edfff,0x17203c,2));
 const light=new THREE.DirectionalLight(0xffffff,2);
 light.position.set(10,20,10);
 scene.add(light);

 buildArena();
 animate();
}

function buildArena(){
 const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA*2,ARENA*2),
  new THREE.MeshStandardMaterial({color:0x172640,roughness:.8})
 );
 floor.rotation.x=-Math.PI/2;
 floor.position.y=-.12;
 scene.add(floor);

 const grid=new THREE.GridHelper(ARENA*2,50,0x00cfff,0x24446a);
 grid.position.y=-.1;
 scene.add(grid);

 const wallMat=new THREE.MeshStandardMaterial({color:0x253e60});
 for(let i=0;i<4;i++){
  let wall=new THREE.Mesh(new THREE.BoxGeometry(
   i<2?ARENA*2:1,5,i<2?1:ARENA*2),wallMat);
  wall.position.set(
   i===2?-ARENA:i===3?ARENA:0,2.5,
   i===0?-ARENA:i===1?ARENA:0);
  scene.add(wall);
 }

 const colors=[0x126b91,0x344b80,0x176b73,0x503e80];
 for(let i=0;i<32;i++){
  const w=2+Math.random()*4;
  const h=2+Math.random()*7;
  const d=2+Math.random()*4;
  const x=(Math.random()-.5)*70;
  const z=(Math.random()-.5)*70;
  if(Math.abs(x)<5&&Math.abs(z)<5)continue;
  const building=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   new THREE.MeshStandardMaterial({color:colors[i%4],roughness:.7})
  );
  building.position.set(x,h/2,z);
  scene.add(building);

  const edge=new THREE.EdgesGeometry(building.geometry);
  const lines=new THREE.LineSegments(edge,
   new THREE.LineBasicMaterial({color:0x30cfff}));
  lines.position.copy(building.position);
  scene.add(lines);
 }
}

function createModel(p){
 const group=new THREE.Group();
 const material=new THREE.MeshStandardMaterial({
  color:Math.random()>.5?0x00dfff:0xff9b37,
  emissive:0x063044
 });
 const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(.38,.85,4,8),material
 );
 body.position.y=0;
 group.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.27,12,12),
  new THREE.MeshStandardMaterial({color:0xffd5ad})
 );
 head.position.y=.8;
 group.add(head);

 const blaster=new THREE.Mesh(
  new THREE.BoxGeometry(.15,.16,.65),
  new THREE.MeshStandardMaterial({color:0x21eaff,emissive:0x087caa})
 );
 blaster.position.set(.4,.3,-.35);
 group.add(blaster);

 scene.add(group);
 models[p.id]=group;
 updateRemote(p);
}

function removeModel(id){
 if(models[id]){
  scene.remove(models[id]);
  delete models[id];
 }
}

function updateRemote(p){
 if(p.id===myId)return;
 if(!players[p.id])players[p.id]=p;
 else Object.assign(players[p.id],p);
 if(!models[p.id]&&scene)createModel(p);
 if(models[p.id]){
  models[p.id].position.set(p.x,p.y-1.6,p.z);
  models[p.id].rotation.y=p.yaw;
 }
}

function sendState(){
 const me=players[myId];
 if(!me)return;
 Object.assign(me,{
  x:camera.position.x,z:camera.position.z,
  y:camera.position.y,yaw,pitch,score:myScore
 });
 const msg={type:'state',player:me};
 if(host){
  Object.values(connections).forEach(c=>c.open&&c.send(msg));
 }else if(hostConn?.open){
  hostConn.send(msg);
 }
}

function broadcast(){
 if(!host)return;
 const list=Object.values(players);
 const msg={type:'snapshot',players:list};
 Object.values(connections).forEach(c=>c.open&&c.send(msg));
 $('leader').innerHTML=list.map(p=>
  `${p.id.slice(0,12)} : ${p.score} pts`).join('<br>');
}

function checkShot(shooter,origin,dir){
 let best=null,bestT=Infinity;
 const o=new THREE.Vector3(...origin);
 const d=new THREE.Vector3(...dir).normalize();
 for(const p of Object.values(players)){
  if(p.id===shooter)continue;
  const target=new THREE.Vector3(p.x,p.y-.5,p.z);
  const v=target.sub(o);
  const t=v.dot(d);
  if(t<0||t>35)continue;
  const distance=v.sub(d.clone().multiplyScalar(t)).length();
  if(distance<1.0&&t<bestT){
   best=p;bestT=t;
  }
 }
 if(best){
  players[shooter].score=(players[shooter].score||0)+10;
  const c=connections[shooter];
  if(c?.open)c.send({type:'hit',score:players[shooter].score});
  if(shooter===myId)myScore=players[shooter].score;
  broadcast();
 }
}

function drawLaser(origin,dir){
 const start=new THREE.Vector3(...origin);
 const end=start.clone().add(new THREE.Vector3(...dir).multiplyScalar(30));
 const geometry=new THREE.BufferGeometry().setFromPoints([start,end]);
 const line=new THREE.Line(geometry,
  new THREE.LineBasicMaterial({color:0x00faff}));
 scene.add(line);
 lasers.push({line,time:.15});
}

window.shoot=()=>{
 if(!camera||!connected)return;
 const dir=new THREE.Vector3();
 camera.getWorldDirection(dir);
 const origin=camera.position.clone();
 drawLaser(origin.toArray(),dir.toArray());
 if(host){
  checkShot(myId,origin.toArray(),dir.toArray());
  Object.values(connections).forEach(c=>{
   if(c.open)c.send({type:'laser',origin:origin.toArray(),dir:dir.toArray()});
  });
 }else if(hostConn?.open){
  hostConn.send({type:'shoot',origin:origin.toArray(),dir:dir.toArray()});
 }
};

function jump(){
 if(grounded){velocityY=8;grounded=false}
}
window.jump=jump;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(!camera)return;

 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const move=new THREE.Vector3();

 if(keys.KeyW)move.add(forward);
 if(keys.KeyS)move.sub(forward);
 if(keys.KeyD)move.add(right);
 if(keys.KeyA)move.sub(right);

 if(move.length()>0){
  move.normalize().multiplyScalar(SPEED*dt);
  camera.position.add(move);
 }

 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-43,43);
 camera.position.z=THREE.MathUtils.clamp(camera.position.z,-43,43);

 velocityY-=20*dt;
 camera.position.y+=velocityY*dt;
 if(camera.position.y<=1.6){
  camera.position.y=1.6;
  velocityY=0;
  grounded=true;
 }

 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 lasers.forEach((l,i)=>{
  l.time-=dt;
  if(l.time<=0){
   scene.remove(l.line);
   l.line.geometry.dispose();
   lasers.splice(i,1);
  }
 });

 const now=performance.now();
 if(now-lastSend>50){
  sendState();
  lastSend=now;
 }
 if(host&&now-lastBroadcast>100){
  broadcast();
  lastBroadcast=now;
 }

 renderer.render(scene,camera);
}

window.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='Space'){e.preventDefault();jump()}
});
window.addEventListener('keyup',e=>keys[e.code]=false);

rendererSetup();
function rendererSetup(){
 document.addEventListener('click',()=>{
  if(connected&&renderer&&document.pointerLockElement!==renderer.domElement)
   renderer.domElement.requestPointerLock?.();
 });
 document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===renderer?.domElement){
   yaw-=e.movementX*.002;
   pitch-=e.movementY*.002;
   pitch=THREE.MathUtils.clamp(pitch,-1.4,1.4);
  }
 });
 document.addEventListener('mousedown',e=>{
  if(e.button===0&&connected&&document.pointerLockElement===renderer?.domElement)
   shoot();
 });
}

document.querySelectorAll('[data-key]').forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 btn.addEventListener('pointerup',()=>keys[k]=false);
 btn.addEventListener('pointerleave',()=>keys[k]=false);
});

window.addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
